<!doctype html>
<!--
  Chansens maskot, en skiss. Bygger på appikonen: en orange ruta med ett
  ljust C. Ritad från grunden, så det finns inga rättigheter att tänka på.
-->
<html lang="sv">
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:"Figtree";font-weight:400 700;src:url("../docs/figtree.woff2") format("woff2")}
  html,body{margin:0;background:#f5ead8}
  .rad{display:flex;gap:40px;padding:40px;align-items:flex-end}
  .rad div{text-align:center;font-family:"Figtree",sans-serif;font-size:22px;color:#645c50}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- Kroppen: samma form som appikonen. -->
    <g id="kropp">
      <rect x="40" y="40" width="240" height="240" rx="64" fill="#c67139"/>
      <!-- C:et från ikonen, öppet åt höger. -->
      <path d="M 222 112 A 82 82 0 1 0 226 204" fill="none" stroke="#f5ead8" stroke-width="22" stroke-linecap="butt"/>
      <!-- Ögon -->
      <ellipse cx="138" cy="150" rx="13" ry="17" fill="#201e1d"/>
      <ellipse cx="184" cy="150" rx="13" ry="17" fill="#201e1d"/>
      <circle cx="142" cy="144" r="4.5" fill="#fff6ee"/>
      <circle cx="188" cy="144" r="4.5" fill="#fff6ee"/>
      <!-- Kinder -->
      <ellipse cx="120" cy="182" rx="12" ry="7" fill="#e89a6a" opacity=".8"/>
      <ellipse cx="204" cy="182" rx="12" ry="7" fill="#e89a6a" opacity=".8"/>
      <!-- Leende -->
      <path d="M 146 184 Q 161 198 176 184" fill="none" stroke="#201e1d" stroke-width="6" stroke-linecap="round"/>
      <!-- Fötter -->
      <rect x="100" y="270" width="44" height="26" rx="13" fill="#8c491a"/>
      <rect x="176" y="270" width="44" height="26" rx="13" fill="#8c491a"/>
    </g>
  </defs>
</svg>

<div class="rad">
  <div>
    <svg width="320" height="320" viewBox="0 0 320 320"><use href="#kropp"/>
      <path d="M 44 180 Q 18 190 22 214" fill="none" stroke="#c67139" stroke-width="20" stroke-linecap="round"/>
      <path d="M 276 180 Q 302 190 298 214" fill="none" stroke="#c67139" stroke-width="20" stroke-linecap="round"/>
    </svg>
    <br>Står still
  </div>
  <div>
    <svg width="320" height="320" viewBox="0 0 320 320"><use href="#kropp"/>
      <path d="M 44 180 Q 18 190 22 214" fill="none" stroke="#c67139" stroke-width="20" stroke-linecap="round"/>
      <path d="M 276 170 Q 304 140 300 104" fill="none" stroke="#c67139" stroke-width="20" stroke-linecap="round"/>
    </svg>
    <br>Vinkar
  </div>
  <div>
    <svg width="320" height="320" viewBox="0 0 320 320"><use href="#kropp"/>
      <path d="M 44 180 Q 18 190 22 214" fill="none" stroke="#c67139" stroke-width="20" stroke-linecap="round"/>
      <path d="M 276 176 L 314 160" fill="none" stroke="#c67139" stroke-width="20" stroke-linecap="round"/>
    </svg>
    <br>Pekar
  </div>
</div>
</body>
</html>
