<!doctype html>
<!--
  Mall 3, Kontrasten. Ritas bild för bild av videor.js.

  Först en påhittad vanlig annons där "Minst tre års erfarenhet" är
  markerat. Sedan byter bilden till hur många jobb där erfarenhet inte
  krävs som finns på Chansen just nu. Annonsen är påhittad med flit och
  märkt så, och arbetsgivaren heter Exempel, enligt reglerna för
  marknadsföring. Siffran kommer från videor.js via window.DATA.
-->
<html lang="sv">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="gemensam.css">
<style>
  .annons{background:#fff;border-radius:36px;padding:56px 56px 48px;text-align:left;
    box-shadow:0 10px 0 rgba(140,73,26,.10)}
  .annons .etikett{font-family:"Figtree",sans-serif;font-size:32px;color:var(--dampad);margin:0 0 18px}
  .annons h2{font-family:"Figtree",sans-serif;font-weight:700;font-size:62px;line-height:1.15;margin:0 0 8px}
  .annons .ag{font-family:"Figtree",sans-serif;font-size:40px;color:var(--dampad);margin:0 0 34px}
  .annons .krav{font-family:"Figtree",sans-serif;font-size:44px;line-height:1.3;margin:0 0 18px;position:relative}
  .markering{position:absolute;left:-14px;right:-14px;top:-6px;bottom:-6px;border:6px solid var(--knapp);
    border-radius:20px;transform-origin:left center}
  .stor{font-family:"Caprasimo",serif;font-size:96px;line-height:1.1;margin:0 0 30px}
  .tal{font-size:260px}
</style>
</head>
<body>
<div class="ram"></div>
<div class="topp"><span>chansen.nu</span><span id="datum"></span></div>

<div class="scen" id="s1">
  <div class="annons">
    <div class="etikett">Påhittad annons</div>
    <h2>Lagermedarbetare</h2>
    <div class="ag" id="ag"></div>
    <div class="krav"><span class="markering" id="markering"></span>Minst tre års erfarenhet</div>
    <div class="krav">Truckkort</div>
    <div class="krav">B-körkort</div>
  </div>
</div>
<div class="scen" id="s2">
  <div class="stor">Erfarenhet krävs inte.</div>
  <div class="tal" id="tal">0</div>
  <div class="under" id="under"></div>
</div>
<div class="scen" id="s3"><div class="logga">chansen.nu</div></div>

<script src="maskot.js"></script>
<script>
  var D = window.DATA || { plats: "Göteborg", datum: "20 oktober", antal: 55 };

  document.getElementById("datum").textContent = D.datum || "";
  document.getElementById("ag").textContent = "Exempel Lager AB, " + D.plats;
  document.getElementById("under").textContent = "jobb i " + D.plats + " just nu";

  Maskot.repliker([
    "Känner du igen det här? Krav på erfarenhet, redan för ditt första jobb.",
    "På Chansen ser du jobb där erfarenhet inte krävs.",
    "Du hittar dem på chansen.nu"
  ]);

  function klamp(x) { return Math.max(0, Math.min(1, x)); }
  function mjuk(x) { x = klamp(x); return 1 - Math.pow(1 - x, 3); }
  function synlig(t, a, b) { return klamp((t - a) / 0.5) * klamp((b - t) / 0.5); }

  window.LANGD = 17;
  window.BILDER = [3.5, 9.2, 15];
  window.rita = function (t) {
    var a = synlig(t, 0, 6), b = synlig(t, 6, 13), c = synlig(t, 13, 99);
    document.getElementById("s1").style.opacity = a;
    document.getElementById("s2").style.opacity = b;
    document.getElementById("s3").style.opacity = c;
    Maskot.rita(t, [a, b, c], a > 0.5 ? "pekar" : "vinkar");

    // Ringen runt kravet ritas fram.
    var m = mjuk((t - 1.6) / 0.6);
    var mark = document.getElementById("markering");
    mark.style.opacity = m;
    mark.style.transform = "scaleX(" + m + ")";

    // Siffran räknas upp.
    var tal = document.getElementById("tal");
    tal.textContent = Math.round(D.antal * mjuk((t - 6.6) / 2.2));
    var puff = klamp((t - 8.8) / 0.25) * klamp((9.4 - t) / 0.35);
    tal.style.transform = "scale(" + (1 + 0.12 * puff) + ")";
  };
  window.rita(0);
</script>
</body>
</html>
