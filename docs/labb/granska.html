<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Chansen Admin</title>
<link rel="manifest" href="granska.webmanifest">
<meta name="theme-color" content="#16130f">
<link rel="apple-touch-icon" href="admin-icon-192.png">

<style>
  :root{
    --bg:#16130f; --yta:#211c16; --yta2:#2b241c; --linje:#3a3128;
    --text:#f0e9df; --damp:#9c9183; --accent:#e08a4a; --accent-mork:#b96a2f;
    --gron:#9fd67f; --gul:#e8c15a; --rod:#e87c6b;
    --sans:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
    font-size:15px;line-height:1.5;
    padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}

  .topp{background:#000;border-bottom:2px solid var(--accent);padding:11px 16px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    position:sticky;top:0;z-index:20}
  .topp .namn{font-family:var(--mono);font-size:12px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent)}
  .topp .vad{font-size:13px;color:var(--damp)}
  .topp .ut{margin-left:auto;background:none;border:1px solid var(--linje);
    color:var(--damp);border-radius:6px;padding:5px 11px;font-size:12.5px;
    font-family:var(--sans);cursor:pointer}

  .wrap{max-width:1040px;margin:0 auto;padding:14px 12px 60px}

  .flikar{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}
  .flikar button{background:var(--yta);border:1px solid var(--linje);color:var(--damp);
    border-radius:7px;padding:8px 14px;font-size:13.5px;font-family:var(--sans);
    cursor:pointer}
  .flikar button.on{background:var(--accent);border-color:var(--accent);color:#1a1409;
    font-weight:600}

  .rad{background:var(--yta);border:1px solid var(--linje);border-radius:8px;
    padding:11px 13px;margin-bottom:7px}
  .rad.nekad{opacity:.62}
  .radtopp{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;margin-bottom:9px}
  .nr{font-family:var(--mono);font-size:13px;color:var(--accent);letter-spacing:.04em}
  .status{font-family:var(--mono);font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;padding:3px 8px;border-radius:4px}
  .status.vantar{background:rgba(232,193,90,.16);color:var(--gul)}
  .status.godkand{background:rgba(159,214,127,.16);color:var(--gron)}
  .status.nekad{background:rgba(232,124,107,.16);color:var(--rod)}
  .tid{font-family:var(--mono);font-size:12px;color:var(--damp);margin-left:auto}

  .titel{font-size:15.5px;font-weight:600;margin-bottom:1px;line-height:1.3}
  .foretag{color:var(--damp);font-size:13px;margin-bottom:9px}

  /* Två kolumner på bredare skärmar, så att hela annonsen ryms utan
     att man behöver skrolla. */
  .falt{display:grid;grid-template-columns:128px 1fr;gap:1px 10px;
    font-size:12.5px;line-height:1.45;margin-bottom:9px}
  @media (min-width:760px){
    .falt{grid-template-columns:118px 1fr 118px 1fr;column-gap:14px}
  }
  .falt dt{color:var(--damp)}
  .falt dd{margin:0;word-break:break-word}
  .falt dd.mono{font-family:var(--mono);font-size:12.5px}

  .kontroller{border-top:1px solid var(--linje);padding-top:8px;margin-bottom:9px}
  .kontroll{font-size:12px;display:flex;gap:7px;align-items:flex-start;margin-bottom:2px}
  .kontroll .m{font-family:var(--mono);font-size:11px;letter-spacing:.06em;
    min-width:62px;padding-top:1px}
  .kontroll.ok .m{color:var(--gron)}
  .kontroll.varning .m{color:var(--gul)}
  .kontroll.fel .m{color:var(--rod)}

  .knappar{display:flex;gap:9px;flex-wrap:wrap}
  .btn{border:none;border-radius:6px;padding:7px 14px;font-size:13px;
    font-family:var(--sans);font-weight:600;cursor:pointer}
  .btn.ja{background:var(--gron);color:#15200d}
  .btn.nej{background:transparent;border:1px solid var(--rod);color:var(--rod)}
  .btn:disabled{opacity:.45;cursor:default}

  .ruta{background:var(--yta);border:1px solid var(--linje);border-radius:10px;
    padding:20px;margin-top:40px}
  .ruta h1{font-size:19px;margin:0 0 6px}
  .ruta p{color:var(--damp);font-size:14px;margin:0 0 16px}
  input.nyckel{width:100%;background:var(--bg);border:1px solid var(--linje);
    color:var(--text);border-radius:7px;padding:12px;font-family:var(--mono);
    font-size:13px;margin-bottom:12px}
  .fel{color:var(--rod);font-size:13.5px;margin-top:10px}
  .tomt{color:var(--damp);padding:30px 0;text-align:center}

  .oversikt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .ruta-liten{background:var(--yta);border:1px solid var(--linje);border-radius:6px;
    padding:7px 11px;min-width:74px}
  .ruta-liten .siffra{font-family:var(--mono);font-size:17px;line-height:1.2}
  .ruta-liten .vad2{font-size:11.5px;color:var(--damp);letter-spacing:.04em}
  .ruta-liten.gul .siffra{color:var(--gul)}
  .ruta-liten.gron .siffra{color:var(--gron)}
  .ruta-liten.rod .siffra{color:var(--rod)}
  .vanligast{font-size:12.5px;color:var(--damp);margin:0 0 16px;line-height:1.6}

  .landrad{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .flikar.liten button{padding:6px 11px;font-size:12.5px}
  /* ── statistik ── */
  .stat-period{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}
  .stat-period button{background:var(--yta);border:1px solid var(--linje);color:var(--damp);
    border-radius:6px;padding:6px 11px;font-size:12.5px;font-family:var(--sans);cursor:pointer}
  .stat-period button.on{background:var(--yta2);border-color:var(--accent);color:var(--text)}
  .stat-rutor{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:18px}
  .stat-ruta{background:var(--yta);border:1px solid var(--linje);border-radius:8px;padding:11px 13px}
  .stat-ruta .tal{font-size:23px;font-weight:600;line-height:1.15;color:var(--text);font-variant-numeric:tabular-nums}
  .stat-ruta .etikett{font-size:12px;color:var(--damp);margin-top:3px}
  .stat-ruta .extra{font-size:11.5px;color:var(--damp);margin-top:2px}
  .stat-kort{background:var(--yta);border:1px solid var(--linje);border-radius:8px;
    padding:13px 14px 10px;margin-bottom:12px;position:relative}
  .stat-kort h3{font-size:14px;font-weight:600;margin:0 0 2px}
  .stat-kort .under{font-size:12px;color:var(--damp);margin:0 0 8px}
  .stat-graf{position:relative}
  .stat-graf svg{display:block;width:100%;overflow:visible}
  .stat-tips{position:absolute;pointer-events:none;background:#000;border:1px solid var(--linje);
    border-radius:6px;padding:6px 9px;font-size:12px;white-space:nowrap;display:none;z-index:5}
  .stat-tips b{font-weight:600}
  .stat-tva{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
  .stat-lista{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:6px 10px;align-items:center;font-size:13px}
  .stat-lista .namn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stat-lista .stapel{grid-column:1 / 2;height:5px;border-radius:3px;background:var(--yta2);margin-top:-3px}
  .stat-lista .stapel i{display:block;height:100%;border-radius:3px;background:var(--accent)}
  .stat-lista .v{font-size:13px;font-weight:600;text-align:right;grid-row:span 2;font-variant-numeric:tabular-nums}
  .stat-not{font-size:12px;color:var(--damp);margin:10px 0 0}
  .stat-fel{border-color:var(--rod);color:var(--rod);font-size:13px}
  .stat-tabell{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
  .stat-tabell th,.stat-tabell td{text-align:right;padding:4px 6px;border-bottom:1px solid var(--linje)}
  .stat-tabell th:first-child,.stat-tabell td:first-child{text-align:left}
  .stat-tabell td{font-variant-numeric:tabular-nums}
  details.stat-kort summary{cursor:pointer;font-size:13.5px;color:var(--damp)}

  .hjalpknapp{margin-left:auto;background:transparent;border:1px solid var(--accent);
    color:var(--accent);border-radius:7px;padding:6px 12px;font-size:12.5px;
    font-family:var(--sans);cursor:pointer}
  .landhjalp{background:var(--yta2);border:1px solid var(--linje);border-radius:10px;
    padding:15px;margin-bottom:14px;font-size:13.5px;line-height:1.6}
  .landhjalp h3{margin:0 0 7px;font-size:14px;color:var(--accent)}
  .landhjalp h3:not(:first-child){margin-top:16px}
  .landhjalp ul{margin:0;padding-left:19px}
  .landhjalp li{margin-bottom:4px}
  .landhjalp a{color:var(--accent)}
  .landhjalp .mono{font-family:var(--mono);font-size:12.5px}

  .land{font-family:var(--mono);font-size:11px;letter-spacing:.1em;padding:3px 7px;
    border-radius:4px;background:var(--yta2);color:var(--damp)}

  .genvagar{font-family:var(--mono);font-size:11px;color:var(--damp);
    margin:-6px 0 14px;letter-spacing:.03em}
  @media (max-width:700px){ .genvagar{display:none} }

  .sok{width:100%;background:var(--yta);border:1px solid var(--linje);color:var(--text);
    border-radius:8px;padding:10px 13px;font-size:14px;font-family:var(--sans);
    margin-bottom:14px}

  .btn.andra{background:transparent;border:1px solid var(--linje);color:var(--damp)}
  .btn.mejl{background:transparent;border:1px solid var(--accent);color:var(--accent)}
  .btn.bort{background:transparent;border:1px solid var(--rod);color:var(--rod)}

  .falt dd.andringsbar{cursor:text;border-bottom:1px dashed var(--linje)}
  .falt dd.andringsbar:hover{border-bottom-color:var(--accent);color:var(--accent)}

  .forhands{background:var(--yta2);border:1px solid var(--linje);border-radius:8px;
    padding:11px 12px;margin-bottom:9px;font-size:12.5px;line-height:1.5}
  .forhands .etikett{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
    color:var(--accent);text-transform:uppercase;margin-bottom:6px}
  .forhands h4{margin:0 0 3px;font-size:16px}
  .forhands .ag{color:var(--damp);font-size:13px;margin-bottom:8px}
  .forhands .taggar{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .forhands .tagg{background:var(--bg);border-radius:999px;padding:3px 10px;font-size:11.5px;
    color:var(--damp)}
  .laddar{color:var(--damp);padding:24px 0}
</style>
</head>
<body>

<div class="topp">
  <span class="namn">Chansen Admin</span>
  <span class="vad">Annonser från arbetsgivare</span>
  <button class="ut" onclick="loggaUt()" id="utknapp" style="display:none">Logga ut</button>
</div>

<div class="wrap">

  <div id="login" class="ruta" style="display:none">
    <h1>Logga in</h1>
    <p>Du loggas ut automatiskt efter tolv timmar.</p>
    <input class="nyckel" id="anvandare" type="text" placeholder="Användarnamn"
           autocomplete="username" spellcheck="false" autocapitalize="none">
    <input class="nyckel" id="losen" type="password" placeholder="Lösenord"
           autocomplete="current-password">
    <button class="btn ja" onclick="loggaIn()">Logga in</button>
    <div class="fel" id="loginfel"></div>
  </div>

  <div id="panel" style="display:none">
    <div id="oversikt" class="oversikt"></div>

    <div class="flikar">
      <button id="f-vantar" class="on" onclick="visa('väntar')">Väntar</button>
      <button id="f-godkänd" onclick="visa('godkänd')">Godkända</button>
      <button id="f-nekad" onclick="visa('nekad')">Nekade</button>
      <button id="f-borttagen" onclick="visa('borttagen')">Borttagna</button>
      <button id="f-alla" onclick="visa('')">Alla</button>
      <button id="f-synpunkter" onclick="visaSynpunkter()">Synpunkter</button>
      <button id="f-statistik" onclick="visaStatistik()">Statistik</button>
    </div>

    <div class="landrad">
      <div class="flikar liten">
        <button id="l-alla" class="on" onclick="valjLand('')">Alla länder</button>
        <button id="l-SE" onclick="valjLand('SE')">Sverige</button>
        <button id="l-NO" onclick="valjLand('NO')">Norge</button>
        <button id="l-UK" onclick="valjLand('UK')">Storbritannien</button>
      </div>
      <button class="hjalpknapp" onclick="visaHjalp()">Att tänka på</button>
    </div>

    <div id="landhjalp" class="landhjalp" style="display:none"></div>

    <input class="sok" id="sok" placeholder="Sök på nummer, företag, titel eller ort"
           oninput="filtrera()" autocomplete="off">

    <div class="genvagar">1–5 byter flik · S söker · ? visar vad man ska tänka på</div>
    <div id="lista"><p class="laddar">Hämtar...</p></div>
  </div>

</div>

<script>
/* Adressen till Apps Script. Samma som formuläret skickar till. */
var API = "https://script.google.com/macros/s/AKfycbxkQPEXo4qu04JP9kHBziLLCLXy-sQc_vgK86UtY29GnohJNR1yjfOdQuISwXZmlYSK/exec";

var biljett = "";
var inloggad = "";
var nuvarande = "väntar";
var allaRader = [];     // det senast hämtade, för sökningen
var roll = "admin";     // admin får ändra, lasare får bara titta
var nuvarandeLand = "";

function fly(t){
  return String(t == null ? "" : t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

/* ── inloggning ─────────────────────────────────────────────────── */

function loggaIn(){
  var namn = (document.getElementById("anvandare").value || "").trim();
  var losen = document.getElementById("losen").value || "";
  if (!namn || !losen){
    document.getElementById("loginfel").textContent = "Fyll i båda fälten.";
    return;
  }
  document.getElementById("loginfel").textContent = "Kontrollerar...";

  fetch(API + "?vad=logga-in&namn=" + encodeURIComponent(namn)
            + "&losen=" + encodeURIComponent(losen))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || !d.ok){
        document.getElementById("loginfel").textContent =
          (d && d.fel) ? "Fel användarnamn eller lösenord." : "Det gick inte just nu.";
        return;
      }
      biljett = d.biljett;
      inloggad = d.namn || namn;
      roll = d.roll || "admin";
      try {
        localStorage.setItem("chansen-biljett", biljett);
        localStorage.setItem("chansen-vem", inloggad);
        localStorage.setItem("chansen-roll", roll);
      } catch(e){}
      document.getElementById("losen").value = "";
      oppna();
    })
    .catch(function(){
      document.getElementById("loginfel").textContent = "Det gick inte att nå systemet.";
    });
}

function oppna(){
  document.getElementById("login").style.display = "none";
  document.getElementById("panel").style.display = "block";
  document.getElementById("utknapp").style.display = "block";
  var v = document.querySelector(".topp .vad");
  if (v && inloggad) {
    v.textContent = inloggad + (roll === "lasare" ? " · läsare" : " · admin");
  }
  visa("väntar");
}

function loggaUt(){
  if (biljett){
    try { fetch(API + "?vad=logga-ut&biljett=" + encodeURIComponent(biljett)); } catch(e){}
  }
  try {
    localStorage.removeItem("chansen-biljett");
    localStorage.removeItem("chansen-vem");
    localStorage.removeItem("chansen-roll");
  } catch(e){}
  location.reload();
}

/* ── hämta och rita ─────────────────────────────────────────────── */

function hamta(status, klar){
  var url = API + "?vad=lista&biljett=" + encodeURIComponent(biljett)
          + (status ? "&status=" + encodeURIComponent(status) : "")
          + (nuvarandeLand ? "&land=" + encodeURIComponent(nuvarandeLand) : "");
  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || !d.ok){ if (klar) klar(false); return; }
      if (klar) klar(true);
      allaRader = d.rader || [];
      filtrera();
      hamtaOversikt();
    })
    .catch(function(){
      if (klar) klar(false);
      document.getElementById("lista").innerHTML =
        '<p class="tomt">Det gick inte att hämta just nu.</p>';
    });
}

function filtrera(){
  var q = (document.getElementById("sok").value || "").toLowerCase().trim();
  if (!q) { rita(allaRader); return; }
  rita(allaRader.filter(function(o){
    return [o["Nummer"], o["Företag"], o["Titel"], o["Ort"], o["Organisationsnummer"]]
      .join(" ").toLowerCase().indexOf(q) > -1;
  }));
}

/* ── översikt ───────────────────────────────────────────────────── */

function hamtaOversikt(){
  fetch(API + "?vad=oversikt&biljett=" + encodeURIComponent(biljett))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || !d.ok) return;
      var l = d.lagen || {};
      var rutor = [
        ["", d.totalt || 0, "totalt"],
        ["gul", l["väntar"] || 0, "väntar"],
        ["gron", l["godkänd"] || 0, "godkända"],
        ["rod", l["nekad"] || 0, "nekade"]
      ];
      var html = rutor.map(function(r){
        return '<div class="ruta-liten ' + r[0] + '"><div class="siffra">' + r[1]
          + '</div><div class="vad2">' + r[2] + "</div></div>";
      }).join("");
      document.getElementById("oversikt").innerHTML = html;

      var v = (d.vanligast || []).filter(function(x){ return x.antal > 1; });
      var gammal = document.getElementById("vanligast");
      if (gammal) gammal.remove();
      if (v.length){
        var p = document.createElement("p");
        p.className = "vanligast";
        p.id = "vanligast";
        p.innerHTML = "Oftast: " + v.map(function(x){
          return fly(x.text) + " (" + x.antal + ")";
        }).join(" · ");
        document.getElementById("oversikt").after(p);
      }
    })
    .catch(function(){});
}

function valjLand(land){
  nuvarandeLand = land;
  ["", "SE", "NO", "UK"].forEach(function(l){
    var kn = document.getElementById("l-" + (l || "alla"));
    if (kn) kn.className = (l === land) ? "on" : "";
  });
  var h = document.getElementById("landhjalp");
  if (h.style.display === "block") visaHjalp(true);
  visa(nuvarande);
}

/* ── att tänka på, per land ─────────────────────────────────────── */

var HJALP = {
  SE: '<h3>Sverige</h3><ul>'
    + '<li>Organisationsnumret kontrolleras automatiskt med kontrollsiffra, men slå ändå upp företaget på <a href="https://www.allabolag.se" target="_blank" rel="noopener">allabolag.se</a> och se att namnet stämmer.</li>'
    + '<li>Lönen ska vara ett belopp eller kollektivavtal. Timlön under 80 eller över 500 kronor nekas automatiskt.</li>'
    + '<li>Under 18 får inte arbeta natt. Kolla att arbetstiderna stämmer med vad de svarat om minderåriga.</li>'
    + '<li>Kräver jobbet utdrag ur belastningsregistret ska det stå, annars blir filtret fel.</li>'
    + '<li>Bemanningsföretag är tillåtet, men ska märkas så att den som söker vet vem som blir arbetsgivare.</li>'
    + "</ul>",
  NO: '<h3>Norge</h3><ul>'
    + '<li>Organisasjonsnummer är nio siffror med kontrollsiffra, precis som det svenska. Slå upp företaget på <a href="https://w2.brreg.no" target="_blank" rel="noopener">Brønnøysundregistrene</a> och se att namnet stämmer.</li>'
    + '<li>Minstelønn finns bara i vissa branscher, bland annat bygg, städ, hotell och restaurang. I övrigt sätts lönen fritt, så kontrollera att beloppet är rimligt för yrket.</li>'
    + '<li>Åldersreglerna följer arbeidsmiljøloven kapitel 11. Nattförbud från klockan 21 för den som är under 18, alltså en timme tidigare än i Sverige.</li>'
    + '<li>Taxi och persontransport kräver kjøreseddel och minst 20 år.</li>'
    + '<li>Kräver jobbet politiattest ska det stå, det motsvarar vårt utdrag ur belastningsregistret.</li>'
    + '<li>Se upp med fagbrev, som är ett yrkesbevis, och med annonser på nynorska där orden stavas annorlunda.</li>'
    + "</ul>",
  UK: '<h3>Storbritannien</h3><ul>'
    + '<li>Company number har ingen kontrollsiffra, bara en form: åtta siffror, eller två bokstäver och sex siffror. <b>Slå alltid upp det</b> på <a href="https://find-and-update.company-information.service.gov.uk" target="_blank" rel="noopener">Companies House</a> och se att namnet stämmer.</li>'
    + '<li>Minimilön per timme sedan 1 april 2026: <span class="mono">£12.71</span> från 21 år, <span class="mono">£10.85</span> för 18 till 20, <span class="mono">£8.00</span> under 18 och för lärlingar. Ändras varje april.</li>'
    + '<li>Står det en lön under £12.71 måste annonsen också rikta sig till yngre, annars är den olaglig.</li>'

function visaHjalp(behall){

function visa(status){
  lamnaStatistik_();
  nuvarande = status;
  var syn = document.getElementById("f-synpunkter");
  if (syn) syn.className = "";
  ["väntar","godkänd","nekad",""].forEach(function(s){
    var kn = document.getElementById("f-" + (s || "alla"));
    if (kn) kn.className = (s === status) ? "on" : "";
  });
  document.getElementById("lista").innerHTML = '<p class="laddar">Hämtar...</p>';

function kontrollrader(text){
  if (!text) return "";
  return String(text).split(" | ").map(function(k){
    var sort = k.indexOf("FEL") === 0 ? "fel"
             : k.indexOf("VARNING") === 0 ? "varning" : "ok";
    var ord = k.split(" ")[0];
    return '<div class="kontroll ' + sort + '"><span class="m">' + fly(ord)
      + '</span><span>' + fly(k.slice(ord.length).trim()) + "</span></div>";
  }).join("");
}

var ANDRINGSBARA = ["Titel","Beskrivning","Ort","Omfattning","Anställningsform",
  "Kategori","Lön","Utdrag","Under 18","Länk","Sista","Kontakt för sökande",
  "Annat","Timmar","Kollektivavtal"];

function falt(o){
  var par = [
    ["Organisationsnr", o["Organisationsnummer"], true],
    ["Ort", o["Ort"]],
    ["Omfattning", o["Omfattning"]],
    ["Anställningsform", o["Anställningsform"]],
    ["Kategori", o["Kategori"]],
    ["Lön", o["Lön"]],
    ["Timmar", o["Timmar"]],
    ["Kollektivavtal", o["Kollektivavtal"]],
    ["Utdrag krävs", o["Utdrag"]],
    ["Under 18 får ta", o["Under 18"]],
    ["Erfarenhet krävs", o["Erfarenhet krävs"]],
    ["Behörighet krävs", o["Behörighet krävs"]],
    ["Sista ansökningsdag", o["Sista"], true],
    ["Länk", o["Länk"], true],
    ["Ansökan går till", o["Kontakt för sökande"]],
    ["Beskrivning", o["Beskrivning"]],
    ["Annat", o["Annat"]],
    ["Inskickad av", o["Kontakt"]],
    ["Mejl", o["Mejl"], true]
  ];
  var ut = "";
  for (var i = 0; i < par.length; i++){
    var v = par[i][1];
    if (!v) continue;
    // Vilket fält i kalkylarket raden hör till, så det går att ändra
    var falt = { "Organisationsnr":"Organisationsnummer", "Utdrag krävs":"Utdrag",
      "Under 18 får ta":"Under 18", "Sista ansökningsdag":"Sista",
      "Ansökan går till":"Kontakt för sökande", "Inskickad av":"Kontakt" }[par[i][0]]
      || par[i][0];
    var gar = roll === "admin" && ANDRINGSBARA.indexOf(falt) > -1
              && o["Status"] === "väntar";
    var klasser = (par[i][2] ? "mono " : "") + (gar ? "andringsbar" : "");
    ut += "<dt>" + fly(par[i][0]) + "</dt><dd"
       + (klasser.trim() ? ' class="' + klasser.trim() + '"' : "")
       + (gar ? ' onclick="andra(\'' + fly(o["Nummer"]) + '\',\'' + fly(falt) + '\')"' : "")
       + ">" + fly(v) + "</dd>";
  }
  return '<dl class="falt">' + ut + "</dl>";
}

/* Så här kommer annonsen se ut på sidan. */
function forhands(o){
  var taggar = [o["Omfattning"], o["Kategori"], o["Anställningsform"]]
    .filter(Boolean).map(function(t){ return '<span class="tagg">' + fly(t) + "</span>"; });
  if (/nej/i.test(o["Utdrag"] || "")) taggar.push('<span class="tagg">Nämner inte utdrag</span>');
  if (/ja/i.test(o["Under 18"] || "")) taggar.push('<span class="tagg">Från 16 år</span>');

  var text = String(o["Beskrivning"] || "");
  return '<div class="forhands">'
    + '<div class="etikett">Så ser den ut på sidan</div>'
    + "<h4>" + fly(o["Titel"]) + "</h4>"
    + '<div class="ag">' + fly(o["Företag"]) + (o["Ort"] ? " · " + fly(o["Ort"]) : "")
    + " · lagd upp av arbetsgivaren</div>"
    + "<div>" + fly(text.length > 180 ? text.slice(0, 180) + "..." : text) + "</div>"
    + '<div class="taggar">' + taggar.join("") + "</div>"
    + "</div>";
}

function rita(rader){
  var el = document.getElementById("lista");
  if (!rader.length){
    el.innerHTML = '<p class="tomt">Inget här.</p>';
    return;
  }
  el.innerHTML = rader.map(function(o){
    var st = (o["Status"] || "väntar");
    var klass = st === "godkänd" ? "godkand" : st === "nekad" ? "nekad" : "vantar";
    var nr = fly(o["Nummer"]);
    var knappar = "";
    if (roll !== "admin"){
      knappar = (o["Skäl"] ? '<div class="kontroll"><span class="m"></span><span>'
        + fly(o["Skäl"]) + "</span></div>" : "");
    } else if (st === "väntar"){
      knappar = '<div class="knappar">'
        + '<button class="btn ja" onclick="avgor(\'' + nr + '\',true)">Godkänn</button>'
        + '<button class="btn nej" onclick="avgor(\'' + nr + '\',false)">Neka</button>'
        + '<button class="btn mejl" onclick="mejla(\'' + nr + '\',\'fraga\')">Mejla</button>'
        + "</div>";
    } else if (st === "godkänd"){
      knappar = '<div class="knappar">'
        + '<button class="btn mejl" onclick="mejla(\'' + nr + '\',\'publicerad\')">Mejla</button>'
        + '<button class="btn bort" onclick="taBort(\'' + nr + '\')">Ta bort</button>'
        + "</div>";
    } else {
      knappar = (o["Skäl"] ? '<div class="kontroll"><span class="m"></span><span>'
        + fly(o["Skäl"]) + "</span></div>" : "")
        + '<div class="knappar"><button class="btn mejl" onclick="mejla(\'' + nr
        + '\',\'nekad\')">Mejla</button></div>";'.replace(/;$/, "");
    }

    return '<div class="rad ' + (st === "nekad" ? "nekad" : "") + '">'
      + '<div class="radtopp">'
      +   '<span class="nr">' + fly(o["Nummer"] || "utan nummer") + "</span>"
      +   '<span class="status ' + klass + '">' + fly(st) + "</span>"
      +   '<span class="land">' + fly(o["Land"] || "SE") + "</span>"
      +   '<span class="tid">' + fly(o["Tidpunkt"]) + "</span>"
      + "</div>"
      + '<div class="titel">' + fly(o["Titel"]) + "</div>"
      + '<div class="foretag">' + fly(o["Företag"]) + "</div>"
      + (st === "väntar" || st === "godkänd" ? forhands(o) : "")
      + falt(o)
      + '<div class="kontroller">' + kontrollrader(o["Kontroller"]) + "</div>"
      + knappar
      + "</div>";
  }).join("");
}

/* ── synpunkter ─────────────────────────────────────────────────── */

function visaSynpunkter(){
  lamnaStatistik_();
  nuvarande = "synpunkter";
  ["väntar","vantar","godkänd","nekad","borttagen",""].forEach(function(st){
    var kn = document.getElementById("f-" + (st || "alla"));
    if (kn) kn.className = "";
  });
  document.getElementById("f-synpunkter").className = "on";
  document.getElementById("lista").innerHTML = '<p class="laddar">Hämtar...</p>';

  fetch(API + "?vad=synpunkter&biljett=" + encodeURIComponent(biljett))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || !d.ok){
        document.getElementById("lista").innerHTML = '<p class="tomt">Det gick inte att hämta.</p>';
        return;
      }
      var rader = d.rader || [];
      if (!rader.length){
        document.getElementById("lista").innerHTML = '<p class="tomt">Inga synpunkter än.</p>';
        return;
      }
      document.getElementById("lista").innerHTML = rader.map(function(o){
        var svar = [
          ["Letade efter", o["Letade efter"]],
          ["Saknar", o["Saknar"]],
          ["Krångligt", o["Krångligt"]],
          ["Kan bli bättre", o["Kan bli bättre"]]
        ].filter(function(p){ return p[1]; });

        var hittade = o["Hittade jobb"] || "";
        var klass = hittade === "Ja" ? "godkand" : hittade === "Nej" ? "nekad" : "vantar";

        return '<div class="rad">'
          + '<div class="radtopp">'
          +   '<span class="status ' + klass + '">hittade jobb: ' + fly(hittade || "?") + "</span>"
          +   '<span class="tid">' + fly(o["Tidpunkt"]) + "</span>"
          + "</div>"
          + (svar.length
              ? svar.map(function(p){
                  return '<div class="titel" style="font-size:14px;color:var(--damp);margin-bottom:1px">'
                    + fly(p[0]) + "</div><div style=\"margin-bottom:11px\">" + fly(p[1]) + "</div>";
                }).join("")
              : '<div class="foretag">Inget skrivet, bara svaret på första frågan.</div>')
          + '<dl class="falt">'
          +   (o["Ålder"] ? "<dt>Ålder</dt><dd>" + fly(o["Ålder"]) + "</dd>" : "")
          +   (o["Ort"] ? "<dt>Ort</dt><dd>" + fly(o["Ort"]) + "</dd>" : "")
          +   (o["Antal jobb"] ? '<dt>Jobb som visades</dt><dd class="mono">' + fly(o["Antal jobb"]) + "</dd>" : "")
          +   (o["Version"] ? '<dt>Version</dt><dd class="mono">' + fly(o["Version"]) + "</dd>" : "")
          +   (o["Mejl"] ? '<dt>Vill ha svar</dt><dd class="mono">' + fly(o["Mejl"]) + "</dd>" : "")
          + "</dl>"
          + (roll === "admin"
              ? '<div class="knappar">'
                + (o["Mejl"]
                    ? '<button class="btn mejl" onclick="svaraSynpunkt(\'' + fly(o["Mejl"])
                      + '\')">Svara</button>'
                    : "")
                + '<button class="btn bort" onclick="raderaSynpunkt(' + o._rad
                + ')">Ta bort</button>'
                + "</div>"
              : "")
          + "</div>";
      }).join("");
    })
    .catch(function(){
      document.getElementById("lista").innerHTML = '<p class="tomt">Det gick inte att hämta.</p>';
    });
}

/* Synpunkten raderas helt, inte bara döljs. Den kan innehålla en
   mejladress, och behöver inte sparas när den är läst och åtgärdad. */
function raderaSynpunkt(rad){
  if (!confirm("Ta bort den här synpunkten?\n\nDen försvinner helt och går inte att få tillbaka.")) return;
  fetch(API + "?vad=radera-synpunkt&biljett=" + encodeURIComponent(biljett)
      + "&rad=" + encodeURIComponent(rad))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.ok) visaSynpunkter();
      else alert("Det gick inte: " + ((d && d.fel) || "okänt fel"));
    })
    .catch(function(){ alert("Det gick inte att nå systemet."); });
}

function svaraSynpunkt(mejl){
  location.href = "mailto:" + encodeURIComponent(mejl)
    + "?subject=" + encodeURIComponent("Tack för dina synpunkter om Chansen")
    + "&body=" + encodeURIComponent("Hej!\n\nTack för att du hörde av dig om Chansen.\n\n\n\n"
        + "Vänliga hälsningar,\nNathalie\nchansen.nu");
}

function andra(nr, falt){
  var rad = allaRader.filter(function(o){ return o["Nummer"] === nr; })[0];
  if (!rad) return;
  var nytt = prompt("Ändra " + falt + " för " + nr + ":", rad[falt] || "");

  fetch(API + "?vad=andra&biljett=" + encodeURIComponent(biljett)

      + "&falt=" + encodeURIComponent(falt)
      + "&varde=" + encodeURIComponent(nytt))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.ok) visa(nuvarande);
      else alert("Det gick inte: " + ((d && d.fel) || "okänt fel"));

    .catch(function(){ alert("Det gick inte att nå systemet."); });
}

function mejla(nr, sort){
  var o = allaRader.filter(function(x){ return x["Nummer"] === nr; })[0];
  if (!o) return;
  var mall = MALLAR[sort] || MALLAR.fraga;
  var text = mall.text;
  if (sort === "nekad" && o["Skäl"]) text = text.replace("\n\n\n\n", "\n\n" + o["Skäl"] + "\n\n");
  var url = "mailto:" + encodeURIComponent(o["Mejl"] || "")
    + "?subject=" + encodeURIComponent(mall.amne + " (" + nr + ")")
    + "&body=" + encodeURIComponent(text);
  location.href = url;
}

function avgor(nr, ja){
  var skal = "";
  if (!ja){
    skal = prompt("Varför nekas " + nr + "?\n\nSkälet sparas, men skickas inte till arbetsgivaren.");
    if (skal === null) return;
  } else {
    if (!confirm("Godkänn " + nr + "?\n\nAnnonsen publiceras vid nästa nattkörning.")) return;
  }

  var url = API + "?vad=" + (ja ? "godkann" : "neka")

          + "&nr=" + encodeURIComponent(nr)
          + "&skal=" + encodeURIComponent(skal || "");

  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.ok) visa(nuvarande);
      else alert("Det gick inte: " + ((d && d.fel) || "okänt fel"));
    })
    .catch(function(){ alert("Det gick inte att nå systemet."); });
}

/* ── tangentbord ────────────────────────────────────────────────────
   Genvägar för den som sitter vid datorn och går igenom många
   annonser. Siffrorna byter flik, s går till sökrutan.            */
document.addEventListener("keydown", function(e){
  if (e.target && /input|textarea/i.test(e.target.tagName)) {
    if (e.key === "Escape") e.target.blur();
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  var flikar = { "1": "väntar", "2": "godkänd", "3": "nekad", "4": "borttagen", "5": "" };
  if (flikar[e.key] !== undefined && document.getElementById("panel").style.display !== "none") {
    visa(flikar[e.key]);
    return;
  }
  if (e.key === "s" || e.key === "S") {
    var sok = document.getElementById("sok");
    if (sok) { e.preventDefault(); sok.focus(); }
  }
  if (e.key === "?") visaHjalp();
});

/* ── statistik ──────────────────────────────────────────────────────
   Hämtas från fliken Statistik i kalkylarket, bakom inloggningen.
   Allt räknas sedan start om man inte väljer en kortare period.    */

var statData = null, statPeriod = 0;

function statDolj_(dolj){
  var lista = [document.querySelector(".landrad"), document.getElementById("sok"),
               document.querySelector(".genvagar"), document.getElementById("landhjalp")];
  lista.forEach(function(el){
    if (!el) return;
    if (dolj){ el.setAttribute("data-statdold", el.style.display || "-"); el.style.display = "none"; }
    else if (el.hasAttribute("data-statdold")){
      var v = el.getAttribute("data-statdold");
      el.style.display = v === "-" ? "" : v;
      el.removeAttribute("data-statdold");
    }
  });
}

function lamnaStatistik_(){
  var f = document.getElementById("f-statistik");
  if (f) f.className = "";
  statDolj_(false);
}

function visaStatistik(){
  nuvarande = "statistik";
  ["väntar","vantar","godkänd","nekad","borttagen",""].forEach(function(st){
    var kn = document.getElementById("f-" + (st || "alla"));
    if (kn) kn.className = "";
  });
  var syn = document.getElementById("f-synpunkter");
  if (syn) syn.className = "";
  document.getElementById("f-statistik").className = "on";
  statDolj_(true);
  document.getElementById("lista").innerHTML = '<p class="laddar">Hämtar statistiken...</p>';

  fetch(API + "?vad=statistik&biljett=" + encodeURIComponent(biljett))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (nuvarande !== "statistik") return;
      if (!d || !d.ok){
        document.getElementById("lista").innerHTML = '<p class="tomt">Det gick inte att hämta statistiken.'
          + (d && d.fel === "inte inloggad" ? " Logga in igen." : "") + "</p>";
        return;
      }
      statData = d;
      ritaStatistik();
    })
    .catch(function(){
      document.getElementById("lista").innerHTML = '<p class="tomt">Det gick inte att hämta statistiken.</p>';
    });
}

function valjStatPeriod(dagar){ statPeriod = dagar; ritaStatistik(); }

function tal_(n){ return Math.round(n || 0).toLocaleString("sv-SE"); }

function dagPlus_(dag, n){
  var d = new Date(dag + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}

function kortDatum_(dag){
  var m = ["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
  return Number(dag.slice(8, 10)) + " " + m[Number(dag.slice(5, 7)) - 1];
}

var STAT_HANDELSER = {
  "visade-jobb": "Visade jobblistan",
  "klick-annons": "Klickade vidare till en annons",
  "sparade-jobb": "Sparade ett jobb",
  "markte-som-sokt": "Markerade som sökt",
  "filter-hog": "Filter: Bäst chans",
  "filter-nyborjare": "Filter: Ingen erfarenhet",
  "filter-deltid": "Filter: Deltid",
  "filter-heltid": "Filter: Heltid",
  "filter-utdrag": "Filter: Nämner inte utdrag",
  "filter-direkt": "Filter: Direkt hos arbetsgivaren",
  "filter-sasong": "Filter: Sommar och säsong",
  "filter-sprak": "Filter: Nämner inte språkkrav",
  "filter-alla": "Filter: Alla"
};
function handelseNamn_(k){
  if (STAT_HANDELSER[k]) return STAT_HANDELSER[k];
  if (k.indexOf("alder-") === 0){
    var a = { "18-eller-aldre": "18 eller äldre", "16-till-17": "16 till 17", "under-16": "under 16" }[k.slice(6)];
    return "Ålder: " + (a || k.slice(6).replace(/-/g, " "));
  }
  return k.replace(/-/g, " ");
}

function kallaNamn_(k){
  var h = String(k || "").toLowerCase();
  if (!h || h === "(direkt)") return "Direkt eller okänd";
  if (h.indexOf("facebook") > -1 || h === "fb.me") return "Facebook";
  if (h.indexOf("instagram") > -1) return "Instagram";
  if (h.indexOf("tiktok") > -1) return "TikTok";
  if (h.indexOf("google") > -1) return "Google";
  if (h.indexOf("bing") > -1) return "Bing";
  if (h.indexOf("linkedin") > -1 || h === "lnkd.in") return "LinkedIn";
  if (h.indexOf("reddit") > -1) return "Reddit";
  if (h === "t.co" || h.indexOf("twitter") > -1 || h === "x.com") return "X";
  if (h.indexOf("threads") > -1) return "Threads";
  if (h.indexOf("chansen.nu") > -1) return "";      // inom sidan räknas inte
  return h.replace(/^www\./, "");
}
var STAT_LANDER = { SE:"Sverige", NO:"Norge", DK:"Danmark", FI:"Finland", GB:"Storbritannien",
  DE:"Tyskland", US:"USA", NL:"Nederländerna", ES:"Spanien", PL:"Polen" };
function enhetNamn_(k){ return { desktop:"Dator", mobile:"Mobil", tablet:"Surfplatta" }[k] || k; }
var STAT_ORTER = { goteborg:"Göteborg", malmo:"Malmö", vasteras:"Västerås", jonkoping:"Jönköping",
  norrkoping:"Norrköping", linkoping:"Linköping", orebro:"Örebro", umea:"Umeå", lulea:"Luleå",
  gavle:"Gävle", boras:"Borås", vaxjo:"Växjö", sodertalje:"Södertälje", ostersund:"Östersund",
  ornskoldsvik:"Örnsköldsvik", taby:"Täby", solleftea:"Sollefteå", skelleftea:"Skellefteå",
  pitea:"Piteå", jarfalla:"Järfälla", molndal:"Mölndal", nassjo:"Nässjö", varnamo:"Värnamo",
  skovde:"Skövde", kavlinge:"Kävlinge", lidingo:"Lidingö", mjolby:"Mjölby", norrtalje:"Norrtälje",
  borlange:"Borlänge", varmdo:"Värmdö", tyreso:"Tyresö", vastervik:"Västervik",
  trollhattan:"Trollhättan", soderhamn:"Söderhamn", "upplands-vasby":"Upplands Väsby",
  "upplands-bro":"Upplands-Bro" };
function sidNamn_(k){
  if (k === "/" || k === "/index.html") return "Startsidan";
  var m = String(k).match(/^\/jobb\/([^\/]+?)(\.html)?$/);
  if (m) return "Ortssida: " + (STAT_ORTER[m[1]] || (m[1].charAt(0).toUpperCase() + m[1].slice(1).replace(/-/g, " ")));
  return k;
}

/* Lägg ihop kartor från flera dagar, med namnbyte. */
function slaIhop_(dagar, falt, namnge, utan){
  var ut = {};
  dagar.forEach(function(d){
    var k = d[falt]; if (!k) return;
    for (var n in k){
      if (utan && utan(n)) continue;
      var namn = namnge ? namnge(n) : n;
      if (!namn) continue;
      ut[namn] = (ut[namn] || 0) + Number(k[n] || 0);
    }
  });
  return Object.keys(ut).map(function(n){ return [n, ut[n]]; })
    .sort(function(a, b){ return b[1] - a[1]; });
}

function listaHtml_(par, max){
  par = par.slice(0, max || 8);
  if (!par.length) return '<p class="stat-not">Inget än.</p>';
  var topp = par[0][1] || 1;
  return '<div class="stat-lista">' + par.map(function(p){
    return '<div class="namn" title="' + fly(p[0]) + '">' + fly(p[0]) + '</div>'
      + '<div class="v">' + tal_(p[1]) + '</div>'
      + '<div class="stapel"><i style="width:' + Math.max(2, Math.round(100 * p[1] / topp)) + '%"></i></div>';
  }).join("") + "</div>";
}

/* Stapeldiagram eller linje, ritat i den bredd som faktiskt finns. */
function rita_(id, punkter, typ, enhet){
  var hall = document.getElementById(id);
  if (!hall) return;
  var W = Math.max(260, hall.clientWidth), H = 190;
  var v = 30, h = 8, t = 10, b = 24;               // marginaler
  var bredd = W - v - h, hojd = H - t - b;
  if (!punkter.length){ hall.innerHTML = '<p class="stat-not">Inget än.</p>'; return; }

  var max = Math.max.apply(null, punkter.map(function(p){ return p.v || 0; }));
  var min = typ === "linje" ? Math.min.apply(null, punkter.map(function(p){ return p.v || 0; })) : 0;
  if (typ === "linje"){ var luft = Math.max(1, (max - min) * 0.15); min = Math.max(0, min - luft); max = max + luft; }
  if (max <= min) max = min + 1;
  // runda skalan till jämna steg
  var steg = Math.pow(10, Math.floor(Math.log10((max - min) / 3 || 1)));
  [1, 2, 5, 10].some(function(f){ if ((max - min) / (steg * f) <= 4){ steg *= f; return true; } });
  var ymin = Math.floor(min / steg) * steg, ymax = Math.ceil(max / steg) * steg;
  function y(val){ return t + hojd - (val - ymin) / (ymax - ymin) * hojd; }

  var svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '" role="img">';
  for (var g = ymin; g <= ymax + 1e-9; g += steg){
    svg += '<line x1="' + v + '" x2="' + (W - h) + '" y1="' + y(g) + '" y2="' + y(g)
      + '" stroke="var(--linje)" stroke-width="1"/>'
      + '<text x="' + (v - 6) + '" y="' + (y(g) + 4) + '" fill="var(--damp)" font-size="11" text-anchor="end">'
      + (g >= 1000 ? (g / 1000).toLocaleString("sv-SE") + "k" : g) + "</text>";
  }
  var n = punkter.length, slot = bredd / n;
  function x(i){ return v + slot * i + slot / 2; }

  if (typ === "stapel"){
    var bw = Math.max(1, slot - 2);
    punkter.forEach(function(p, i){
      var top = y(p.v || 0), bas = y(ymin), hh = Math.max(0, bas - top);
      if (!hh) return;
      var r = Math.min(4, bw / 2, hh);
      var x0 = v + slot * i + 1;
      svg += '<path d="M' + x0 + "," + bas + "V" + (top + r) + "Q" + x0 + "," + top + " " + (x0 + r) + "," + top
        + "H" + (x0 + bw - r) + "Q" + (x0 + bw) + "," + top + " " + (x0 + bw) + "," + (top + r)
        + "V" + bas + 'Z" fill="var(--accent)"/>';
    });
  } else {
    var d = punkter.map(function(p, i){ return (i ? "L" : "M") + x(i).toFixed(1) + "," + y(p.v).toFixed(1); }).join("");
    svg += '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  // datum under, första, mitten och sista
  [0, Math.floor((n - 1) / 2), n - 1].filter(function(i, k, a){ return a.indexOf(i) === k; }).forEach(function(i, k, a){
    var anchor = n === 1 ? "middle" : (i === 0 ? "start" : (i === n - 1 ? "end" : "middle"));
    var xx = anchor === "start" ? v : (anchor === "end" ? W - h : x(i));
    svg += '<text x="' + xx + '" y="' + (H - 6) + '" fill="var(--damp)" font-size="11" text-anchor="' + anchor + '">'
      + fly(punkter[i].etikett) + "</text>";
  });
  // markör för hovring
  svg += '<line class="stat-sikte" x1="0" x2="0" y1="' + t + '" y2="' + (t + hojd) + '" stroke="var(--damp)" stroke-width="1" style="display:none"/>';
  if (typ === "linje") svg += '<circle class="stat-prick" r="4.5" fill="var(--accent)" stroke="var(--yta)" stroke-width="2" style="display:none"/>';
  svg += '<rect class="stat-yta" x="' + v + '" y="0" width="' + bredd + '" height="' + H + '" fill="transparent"/>';
  svg += "</svg>";
  hall.innerHTML = svg + '<div class="stat-tips"></div>';

  var yta = hall.querySelector(".stat-yta"), tips = hall.querySelector(".stat-tips");
  var sikte = hall.querySelector(".stat-sikte"), prick = hall.querySelector(".stat-prick");
  function visaTips(ev){
    var ruta = hall.getBoundingClientRect();
    var px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - ruta.left;
    var i = Math.max(0, Math.min(n - 1, Math.floor((px - v) / slot)));
    var p = punkter[i];
    tips.innerHTML = fly(p.lang || p.etikett) + "<br><b>" + tal_(p.v) + "</b> " + fly(enhet);
    tips.style.display = "block";
    var tx = x(i) + 12;
    if (tx + tips.offsetWidth > W) tx = x(i) - tips.offsetWidth - 12;
    tips.style.left = tx + "px"; tips.style.top = (typ === "linje" ? Math.max(0, y(p.v) - 46) : 6) + "px";
    sikte.setAttribute("x1", x(i)); sikte.setAttribute("x2", x(i)); sikte.style.display = "";
    if (prick){ prick.setAttribute("cx", x(i)); prick.setAttribute("cy", y(p.v)); prick.style.display = ""; }
  }
  function gom(){ tips.style.display = "none"; sikte.style.display = "none"; if (prick) prick.style.display = "none"; }
  yta.addEventListener("mousemove", visaTips);
  yta.addEventListener("touchstart", visaTips, { passive: true });
  yta.addEventListener("touchmove", visaTips, { passive: true });
  yta.addEventListener("mouseleave", gom);
}

function ritaStatistik(){
  var el = document.getElementById("lista");
  var d = statData;
  if (!d) return;
  var alla = d.dagar || [];
  var idag = new Date().toISOString().slice(0, 10);
  var fran = statPeriod ? dagPlus_(idag, -statPeriod) : (d.start || "2000-01-01");
  var dagar = alla.filter(function(x){ return x.datum >= fran; });

  var perioder = [[0, "Sedan start"], [90, "90 dagar"], [30, "30 dagar"], [7, "7 dagar"]];
  var html = '<div class="stat-period">' + perioder.map(function(p){
    return '<button class="' + (statPeriod === p[0] ? "on" : "") + '" onclick="valjStatPeriod(' + p[0] + ')">' + p[1] + "</button>";
  }).join("") + "</div>";

  if (d.fel){
    html += '<div class="stat-kort stat-fel">Senaste insamlingen fick ett fel: ' + fly(d.fel) + "</div>";
  }
  if (!alla.length){
    el.innerHTML = html + '<p class="tomt">Ingen statistik än. Öppna Apps Script och kör hamtaStatistikBakat en gång, så fylls allt sedan start på.</p>';
    return;
  }

  function summa(falt){ return dagar.reduce(function(s, x){ return s + Number(x[falt] || 0); }, 0); }
  function handelse(namn){ return dagar.reduce(function(s, x){ return s + Number((x["Händelser"] || {})[namn] || 0); }, 0); }
  function raknaPerDag(karta){ var s = 0; for (var k in (karta || {})) if (k >= fran) s += karta[k]; return s; }

  var besok = summa("Besök"), visningar = summa("Sidvisningar");
  var klick = handelse("klick-annons"), listor = handelse("visade-jobb");
  var medJobb = alla.filter(function(x){ return x["Jobb Sverige"]; });
  var jobbNu = medJobb.length ? medJobb[medJobb.length - 1]["Jobb Sverige"] : 0;
  var forstaDag = alla[0].datum;
  var dagarSedan = Math.round((new Date(idag) - new Date(d.start || forstaDag)) / 86400000);

  var rutor = [
    [tal_(besok), "besök", statPeriod ? "senaste " + statPeriod + " dagarna" : "sedan " + kortDatum_(d.start || forstaDag)],
    [tal_(visningar), "sidvisningar", ""],
    [tal_(klick), "klick till annonser", listor ? Math.round(100 * klick / listor) + " % av de som såg listan" : ""],
    [tal_(jobbNu), "jobb i Sverige i natt", medJobb.length > 1 ? "var " + tal_(medJobb[0]["Jobb Sverige"]) + " första natten" : ""],
    [tal_(raknaPerDag(d.annonser)), "annonser från arbetsgivare", ""],
    [tal_(raknaPerDag(d.synpunkter)), "synpunkter", ""],
    [tal_(dagarSedan), "dagar sedan start", ""]
  ];
  html += '<div class="stat-rutor">' + rutor.map(function(r){
    return '<div class="stat-ruta"><div class="tal">' + r[0] + '</div><div class="etikett">' + fly(r[1])
      + "</div>" + (r[2] ? '<div class="extra">' + fly(r[2]) + "</div>" : "") + "</div>";
  }).join("") + "</div>";

  // besök: per dag om perioden är kort, annars per vecka
  var span = dagar.length;
  var veckovis = span > 60;
  html += '<div class="stat-kort"><h3>Besök ' + (veckovis ? "per vecka" : "per dag") + '</h3>'
    + '<p class="under">Från Cloudflare, uppskattningar</p><div class="stat-graf" id="graf-besok"></div></div>';
  html += '<div class="stat-kort"><h3>Jobb i Sverige per natt</h3>'
    + '<p class="under">Efter sorteringen, alltså de som syns på Chansen</p><div class="stat-graf" id="graf-jobb"></div></div>';

  html += '<div class="stat-tva">'
    + '<div class="stat-kort"><h3>Varifrån de kom</h3><p class="under">Besök per källa</p>'
    +   listaHtml_(slaIhop_(dagar, "Källor", kallaNamn_), 8) + "</div>"
    + '<div class="stat-kort"><h3>Vad de tryckte på</h3><p class="under">Knapptryck från GoatCounter</p>'
    +   listaHtml_(slaIhop_(dagar, "Händelser", handelseNamn_, function(n){ return n.indexOf("sida:") === 0; }), 10) + "</div>"
    + '<div class="stat-kort"><h3>Mest besökta sidor</h3><p class="under">Sidvisningar</p>'
    +   listaHtml_(slaIhop_(dagar, "Sidor", sidNamn_), 8) + "</div>"
    + '<div class="stat-kort"><h3>Länder och enheter</h3><p class="under">Besök</p>'
    +   listaHtml_(slaIhop_(dagar, "Länder", function(k){ return STAT_LANDER[k] || k; }), 5)
    +   '<div style="height:12px"></div>'
    +   listaHtml_(slaIhop_(dagar, "Enheter", enhetNamn_), 3) + "</div>"
    + "</div>";

  // tabell, för den som vill se varje dag
  html += '<details class="stat-kort"><summary>Visa varje dag som tabell</summary>'
    + '<table class="stat-tabell"><thead><tr><th>Datum</th><th>Besök</th><th>Sidvisn.</th><th>Klick</th><th>Jobb</th></tr></thead><tbody>'
    + dagar.slice().reverse().map(function(x){
        return "<tr><td>" + x.datum + "</td><td>" + (x["Besök"] != null ? tal_(x["Besök"]) : "–")
          + "</td><td>" + (x["Sidvisningar"] != null ? tal_(x["Sidvisningar"]) : "–")
          + "</td><td>" + tal_((x["Händelser"] || {})["klick-annons"]) + "</td><td>"
          + (x["Jobb Sverige"] ? tal_(x["Jobb Sverige"]) : "–") + "</td></tr>";
      }).join("") + "</tbody></table></details>";

  html += '<p class="stat-not">Besöken räknas av Cloudflare och är uppskattningar, knapptrycken av GoatCounter. '
    + "Bara summor per dag sparas, ingenting om enskilda besökare. Uppdateras varje förmiddag.</p>";

  el.innerHTML = html;

  // diagrammen ritas när bredden är känd
  var bp = [];
  if (veckovis){
    var veckor = {};
    dagar.forEach(function(x){
      if (x["Besök"] == null) return;
      var dt = new Date(x.datum + "T12:00:00Z"), dagNr = (dt.getUTCDay() + 6) % 7;
      var mandag = dagPlus_(x.datum, -dagNr);
      veckor[mandag] = (veckor[mandag] || 0) + Number(x["Besök"] || 0);
    });
    bp = Object.keys(veckor).sort().map(function(m){
      return { v: veckor[m], etikett: kortDatum_(m), lang: "Veckan från " + kortDatum_(m) };
    });
  } else {
    bp = dagar.filter(function(x){ return x["Besök"] != null; })
      .map(function(x){ return { v: Number(x["Besök"] || 0), etikett: kortDatum_(x.datum), lang: kortDatum_(x.datum) }; });
  }
  var jp = dagar.filter(function(x){ return x["Jobb Sverige"]; })
    .map(function(x){ return { v: Number(x["Jobb Sverige"]), etikett: kortDatum_(x.datum), lang: kortDatum_(x.datum) }; });
  rita_("graf-besok", bp, "stapel", "besök");
  rita_("graf-jobb", jp, "linje", "jobb");
}

window.addEventListener("resize", function(){
  if (nuvarande !== "statistik" || !statData) return;
  clearTimeout(window._statResize);
  window._statResize = setTimeout(ritaStatistik, 150);
});
