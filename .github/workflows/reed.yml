name: Hämta brittiska jobb från Reed

# Labb. Kör varje natt, efter den brittiska Adzuna-hämtningen.
#
# Skillnaden mot uk.yml är att Reed ger hela annonstexten, så den
# svenska metoden kan användas: läsa hela texten och sortera bort
# hinder, i stället för att leta efter annonser som själva säger att
# erfarenhet inte krävs.
#
# Nyckeln registreras gratis på reed.co.uk/developers/jobseeker och
# läggs som Secret på GitHub med namnet REED_KEY.
#
# Du kan också starta den för hand under fliken Actions.

on:
  schedule:
    - cron: "30 7 * * *"     # 07:30 UTC, mellan den norska och den brittiska
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hamta:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Hämta repot
        uses: actions/checkout@v5

      - name: Installera Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Kör hämtningen
        env:
          REED_KEY: ${{ secrets.REED_KEY }}
        run: node labb/hamta-reed.js

      # Stoppar körningen innan något laddas upp, om en annons ändå
      # innehåller mejl, telefonnummer, personnummer eller ett namn från
      # listan. Då kommer ett mejl från GitHub om att körningen misslyckades.
      - name: Kolla personuppgifter
        env:
          PERSONNAMN: ${{ secrets.PERSONNAMN }}
        run: node kolla-personuppgifter.js labb/reedjobb.json docs/labb/reed-jobb.js

      - name: Spara resultatet
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add labb/reedjobb.json docs/labb/reed-jobb.js
          if git diff --staged --quiet; then
            echo "Inget nytt att spara."
          else
            git commit -m "Nattlig hämtning: brittiska jobb från Reed"
            # Försök upp till fem gånger. Hinner en annan körning ladda upp under
            # tiden avbryts den misslyckade sammanslagningen först, annars fastnar
            # git och resten av försöken fungerar inte.
            for forsok in 1 2 3 4 5; do
              if ! git pull --rebase --autostash origin main; then
                git rebase --abort || true
                git pull --no-rebase -X ours --no-edit origin main
              fi
              git push && break
              if [ "$forsok" = 5 ]; then exit 1; fi
              sleep 15
            done
          fi
