name: Uppdatera jobben

# Kör varje natt och hämtar om jobben från Platsbanken.
# Skriver docs/jobb.js, docs/jobb.json, en sida per ort i docs/jobb/
# och docs/sitemap.xml.
#
# Du kan också starta den för hand under fliken Actions på GitHub,
# knappen heter "Run workflow".
#
# OBS: filen måste sparas utan BOM. Ett osynligt tecken först i filen
# gör att GitHub inte kan läsa den, och då körs ingenting.

on:
  schedule:
    - cron: "0 4 * * *"     # 04:00 UTC, alltså 06:00 svensk sommartid
  workflow_dispatch:

permissions:
  contents: write

jobs:
  uppdatera:
    runs-on: ubuntu-latest
    # Hämtningen har tagit upp mot 45 minuter. Med 45 som gräns avbröt
    # GitHub ibland mitt i, och då sparades ingenting.
    timeout-minutes: 60

    steps:
      - name: Hämta repot
        uses: actions/checkout@v5

      - name: Installera Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Kör hämtningen
        run: node hamta.js

      - name: Skriv dagens inlägg
        run: node dagens-inlagg.js

      # Stoppar körningen innan något laddas upp, om en annons ändå
      # innehåller mejl, telefonnummer, personnummer eller ett namn från
      # listan. Då kommer ett mejl från GitHub om att körningen misslyckades.
      - name: Kolla personuppgifter
        env:
          PERSONNAMN: ${{ secrets.PERSONNAMN }}
        run: node kolla-personuppgifter.js docs/jobb.json docs/jobb.js docs/jobb docs/sitemap.xml dagens-inlagg.txt

      - name: Spara resultatet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # Ortssidorna och sitemap skapas också av hamta.js. De måste
          # sparas här, annars slängs de när körningen är klar.
          # -A tar med sidor som tagits bort, till exempel en ort som
          # inte längre har tillräckligt många jobb.
          git add -A docs/jobb.json docs/jobb.js docs/jobb docs/sitemap.xml dagens-inlagg.txt
          if git diff --staged --quiet; then
            echo "Inget nytt att spara."
            exit 0
          fi
          git commit -m "Uppdaterade jobben"
          # Hämtningen tar flera minuter. Hinner något annat pushas under
          # tiden misslyckas push utan detta, och natten går förlorad.
          # Försök upp till fem gånger. Hinner en annan körning ladda upp
          # under tiden avbryts den misslyckade sammanslagningen först,
          # annars fastnar git och resten av försöken fungerar inte.
          for forsok in 1 2 3 4 5; do
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort || true
              git pull --no-rebase -X ours --no-edit origin main
            fi
            git push && break
            if [ "$forsok" = 5 ]; then exit 1; fi
            sleep 15
          done
