name: Kolla personuppgifter

# Körs varje gång något laddas upp, och varje morgon. Går igenom alla
# filer i repot, och kollar att kalkylarket inte visar för mycket.
# Hittar den mejl, telefonnummer, personnummer eller ett namn från listan
# misslyckas körningen, och GitHub mejlar dig.
#
# Namnen ligger i en secret som heter PERSONNAMN, under Settings,
# Secrets and variables, Actions. Ett namn per rad.
#
# Själva uppgiften skrivs aldrig ut i loggen, bara fil och rad.
#
# OBS: filen måste sparas utan BOM.

on:
  push:
  schedule:
    - cron: "30 5 * * *"   # varje morgon, efter nattkörningen
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kolla:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Hämta repot
        uses: actions/checkout@v5

      - name: Installera Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Kolla personuppgifter
        env:
          PERSONNAMN: ${{ secrets.PERSONNAMN }}
        run: node kolla-personuppgifter.js

      # Kalkylarket med arbetsgivarannonser får bara vara öppet med fliken
      # Publicerat. Är något mer öppet misslyckas körningen och du får ett mejl.
      - name: Kolla kalkylarket
        run: node kolla-kalkylark.js
